# robust_planner_node:
  # ros__parameters:
global_costmap:
  global_costmap: # Nav2 often uses a double-nested 'global_costmap' name
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: "map"
      robot_base_frame: "base_link"
      use_sim_time: false # Set to true if in simulation
      footprint: "[[-0.48, -0.4], [-0.48, 0.4], [0.48, 0.4], [0.48, -0.4]]"
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      width: 30
      height: 30
      origin_x: -15.0
      origin_y: -15.0
      
      # Plugin definitions (Note the string format in ROS 2)
      plugins: ["static_layer", "inflater_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/map"
        subscribe_to_updates: true
        lethal_cost_threshold: 60
        enabled: true

      inflater_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8
        cost_scaling_factor: 0.3
        enabled: true

      # If you eventually uncomment obstacles:
